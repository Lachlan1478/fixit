[pytest]
asyncio_mode = auto
testpaths = .
markers =
    unit: Pure unit tests (no server, no browser)
    api: API integration tests (in-process server, no Claude)
    ui: UI mock tests (Playwright with faked SSE)
    e2e: End-to-end tests (real Claude, ~3-5 min)
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
