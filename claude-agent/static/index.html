<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Agent</title>
  <style>
    :root {
      --bg: #0f0f11;
      --surface: #1a1a1f;
      --surface2: #24242b;
      --border: #2e2e38;
      --text: #e8e8f0;
      --muted: #888899;
      --accent: #7c6af7;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --r: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui,-apple-system,sans-serif; font-size: 15px; line-height: 1.5; }
    .container { max-width: 480px; margin: 0 auto; padding-bottom: 48px; }

    header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .3s; }
    .status-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.working { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: pulse 1s ease-in-out infinite; }
    .status-dot.error { background: var(--red); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .status-label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

    section { padding: 16px; border-bottom: 1px solid var(--border); }
    .section-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

    textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); color: var(--text); padding: 12px; font-size: 15px; font-family: inherit; resize: vertical; min-height: 90px; outline: none; transition: border-color .2s; }
    textarea:focus { border-color: var(--accent); }
    .form-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }

    button { background: var(--accent); color: #fff; border: none; border-radius: var(--r); padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:not(:disabled):hover { opacity: .85; }
    button.secondary { background: var(--surface2); color: var(--text); font-weight: 500; padding: 8px 14px; font-size: 13px; }
    button.danger { background: transparent; color: var(--red); border: 1px solid var(--red); padding: 6px 12px; font-size: 12px; }

    .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Response */
    #response-box { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; margin-top: 12px; }
    #response-box pre { white-space: pre-wrap; word-break: break-word; font-family: 'Menlo','Consolas',monospace; font-size: 13px; color: var(--text); line-height: 1.6; }

    /* Live feed */
    #feed-list { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; }
    .feed-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 16px 0; }
    .feed-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; border-left-width: 3px; }
    .feed-item.tool   { border-left-color: var(--accent); }
    .feed-item.text   { border-left-color: var(--muted); }
    .feed-item.done   { border-left-color: var(--green); }
    .feed-item.error  { border-left-color: var(--red); }
    .feed-item.status { border-left-color: var(--yellow); opacity: .75; }
    .feed-summary { font-size: 13px; color: var(--text); font-family: 'Menlo','Consolas',monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-label { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
    .feed-item.tool   .feed-label { color: var(--accent); }
    .feed-item.done   .feed-label { color: var(--green); }
    .feed-item.error  .feed-label { color: var(--red); }
    .feed-item.status .feed-label { color: var(--yellow); }
    .feed-time { font-size: 10px; font-weight: 400; color: var(--muted); letter-spacing: 0; text-transform: none; margin-left: auto; }

    /* Repository */
    .files-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; min-height: 20px; }
    .file-chip { background: var(--surface2); border-radius: 4px; padding: 2px 8px; font-size: 11px; font-family: 'Menlo','Consolas',monospace; color: var(--yellow); }
    .repo-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; font-family: 'Menlo','Consolas',monospace; font-size: 12px; line-height: 1.6; overflow-x: auto; white-space: pre; max-height: 200px; overflow-y: auto; }
    details.repo-details { margin-top: 8px; }
    details.repo-details summary { font-size: 12px; color: var(--muted); padding: 6px 0; cursor: pointer; user-select: none; list-style: none; display: flex; align-items: center; gap: 6px; }
    details.repo-details summary::before { content: '▶'; font-size: 9px; transition: transform .2s; }
    details.repo-details[open] summary::before { transform: rotate(90deg); }
    .gs-branch   { color: var(--accent); }
    .gs-modified { color: var(--yellow); }
    .gs-added    { color: var(--green); }
    .gs-deleted  { color: var(--red); }
    .gs-untracked { color: var(--muted); }
    .d-add  { color: var(--green); }
    .d-del  { color: var(--red); }
    .d-hunk { color: var(--accent); }
    .d-file { color: var(--text); font-weight: 600; }
    .d-hdr  { color: var(--muted); }
    .d-ctx  { color: var(--muted); }

    #toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: var(--red); color: #fff; padding: 10px 18px; border-radius: var(--r); font-size: 13px; z-index: 100; display: none; max-width: 440px; text-align: center; }
  </style>
</head>
<body>
<div id="toast"></div>
<div class="container">

  <header>
    <h1>🤖 Claude Agent</h1>
    <div class="status-label">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">connecting…</span>
    </div>
  </header>

  <!-- Prompt -->
  <section>
    <div class="section-title">Send Prompt</div>
    <textarea id="prompt" placeholder="Ask Claude to do something…" rows="4"></textarea>
    <div class="form-row">
      <button id="send-btn" onclick="sendPrompt()">Send →</button>
      <div class="spinner" id="spinner"></div>
      <button class="danger" id="reset-btn" onclick="resetSession()" title="Start fresh conversation">Reset</button>
    </div>
    <div id="response-box"><pre id="response-text"></pre></div>
  </section>

  <!-- Live feed -->
  <section>
    <div class="section-title">
      <span>Live Feed</span>
      <button class="secondary" onclick="clearFeed()">Clear</button>
    </div>
    <div id="feed-list"><div class="feed-empty">No activity yet</div></div>
  </section>

  <!-- Repository -->
  <section>
    <div class="section-title">
      <span>Repository</span>
      <button class="secondary" onclick="loadRepo()">Refresh</button>
    </div>
    <div class="files-row" id="repo-files"><span style="color:var(--muted);font-size:13px">No modified files</span></div>
    <details class="repo-details" open>
      <summary>Git Status</summary>
      <pre class="repo-block" id="repo-status">—</pre>
    </details>
    <details class="repo-details">
      <summary>Diff</summary>
      <pre class="repo-block" id="repo-diff">—</pre>
    </details>
  </section>

</div>
<script>
// ── Status ────────────────────────────────────────────────────────────────
function setStatus(state) {
  document.getElementById('status-dot').className = 'status-dot ' + state;
  document.getElementById('status-text').textContent =
    state === 'live' ? 'live' : state === 'working' ? 'working…' : state === 'error' ? 'error' : 'connecting…';
}

// ── Toast ─────────────────────────────────────────────────────────────────
let _toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.style.display = 'none'; }, 4000);
}

// ── Feed ──────────────────────────────────────────────────────────────────
let _hasFeed = false;
function clearFeed() {
  document.getElementById('feed-list').innerHTML = '<div class="feed-empty">No activity yet</div>';
  _hasFeed = false;
}

function addFeedItem(type, label, summary, elapsed_ms) {
  const list = document.getElementById('feed-list');
  if (!_hasFeed) { list.innerHTML = ''; _hasFeed = true; }
  const el = document.createElement('div');
  el.className = 'feed-item ' + type;
  const timeStr = elapsed_ms != null ? `<span class="feed-time">${(elapsed_ms / 1000).toFixed(1)}s</span>` : '';
  el.innerHTML =
    `<div class="feed-label">${escHtml(label)}${timeStr}</div>` +
    `<div class="feed-summary">${escHtml(summary)}</div>`;
  list.appendChild(el);
  list.scrollTop = list.scrollHeight;
}

// ── Utils ─────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Send prompt ───────────────────────────────────────────────────────────
async function sendPrompt() {
  const textarea = document.getElementById('prompt');
  const prompt = textarea.value.trim();
  if (!prompt) return;

  const btn     = document.getElementById('send-btn');
  const spinner = document.getElementById('spinner');
  const box     = document.getElementById('response-box');
  const pre     = document.getElementById('response-text');

  btn.disabled = true;
  spinner.style.display = 'block';
  box.style.display = 'none';
  setStatus('working');
  textarea.value = '';

  try {
    const resp = await fetch('/task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, agent_id: 'default' }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || `HTTP ${resp.status}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop(); // keep incomplete line
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let event;
        try { event = JSON.parse(line.slice(6)); } catch { continue; }
        handleEvent(event, pre, box);
      }
    }

    setStatus('live');
    // Refresh repo after Claude finishes
    setTimeout(loadRepo, 800);

  } catch (err) {
    setStatus('error');
    addFeedItem('error', 'Error', err.message);
    showToast(err.message);
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
  }
}

function handleEvent(event, pre, box) {
  if (event.type === 'status') {
    addFeedItem('status', 'Init', event.message, event.elapsed_ms);
  } else if (event.type === 'tool') {
    addFeedItem('tool', event.name, event.summary, event.elapsed_ms);
  } else if (event.type === 'text') {
    addFeedItem('text', 'Thinking', event.content.slice(0, 120));
  } else if (event.type === 'done') {
    addFeedItem('done', 'Done', event.result.slice(0, 100) || '✓');
    pre.textContent = event.result || '(no response)';
    box.style.display = 'block';
  } else if (event.type === 'error') {
    addFeedItem('error', 'Error', event.message);
    showToast(event.message);
  }
}

// ── Reset session ─────────────────────────────────────────────────────────
async function resetSession() {
  try {
    await fetch('/reset_memory', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agent_id: 'default' }),
    });
    clearFeed();
    document.getElementById('response-box').style.display = 'none';
    addFeedItem('done', 'Session', 'Conversation reset — starting fresh');
  } catch (err) {
    showToast('Reset failed: ' + err.message);
  }
}

// ── Repository ────────────────────────────────────────────────────────────
function renderGitStatus(text) {
  if (!text) return '<span class="gs-branch">Not a git repo</span>';
  return text.split('\n').map(line => {
    if (line.startsWith('##')) return `<span class="gs-branch">${escHtml(line)}</span>`;
    const xy = line.slice(0, 2);
    let cls = '';
    if (xy.includes('M')) cls = 'gs-modified';
    else if (xy.includes('A')) cls = 'gs-added';
    else if (xy.includes('D')) cls = 'gs-deleted';
    else if (xy === '??') cls = 'gs-untracked';
    return `<span class="${cls}">${escHtml(line)}</span>`;
  }).join('\n');
}

function renderGitDiff(text) {
  if (!text) return '<span class="d-ctx">No changes</span>';
  return text.split('\n').map(line => {
    if (line.startsWith('diff --git')) return `<span class="d-file">${escHtml(line)}</span>`;
    if (line.startsWith('+++') || line.startsWith('---') || line.startsWith('index ')) return `<span class="d-hdr">${escHtml(line)}</span>`;
    if (line.startsWith('+')) return `<span class="d-add">${escHtml(line)}</span>`;
    if (line.startsWith('-')) return `<span class="d-del">${escHtml(line)}</span>`;
    if (line.startsWith('@@')) return `<span class="d-hunk">${escHtml(line)}</span>`;
    return `<span class="d-ctx">${escHtml(line)}</span>`;
  }).join('\n');
}

async function loadRepo() {
  try {
    const data = await fetch('/repo').then(r => r.json());
    setStatus('live');
    const filesEl = document.getElementById('repo-files');
    if (data.modified_files && data.modified_files.length > 0) {
      filesEl.innerHTML = data.modified_files
        .map(f => `<span class="file-chip">${escHtml(f)}</span>`).join('');
    } else {
      filesEl.innerHTML = '<span style="color:var(--muted);font-size:13px">No modified files</span>';
    }
    document.getElementById('repo-status').innerHTML = renderGitStatus(data.status || '');
    document.getElementById('repo-diff').innerHTML = renderGitDiff(data.diff || '');
  } catch (err) {
    setStatus('error');
  }
}

// Enter = submit, Shift+Enter = newline
document.getElementById('prompt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPrompt(); }
});

// Initial load
loadRepo().then(() => setStatus('live'));
setInterval(() => { if (!document.hidden) loadRepo(); }, 15000);
</script>
</body>
</html>
